name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

env:
  DOTNETVERSION: "8.0.x"
  APP: "HomeAutio.Mqtt.Denon"
  SOLUTION: "./src/HomeAutio.Mqtt.Denon.sln"
  BUILDOUTPUTPATH: "./src/HomeAutio.Mqtt.Denon/bin/Release/net8.0"
  REGISTRY: ghcr.io
  DOCKER_NAME: "i8beef/homeautio.mqtt.denon"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK ${{ env.DOTNETVERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNETVERSION }}

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore /p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-restore --verbosity normal --logger trx --results-directory "TestResults"

      - name: Upload app build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}
          path: ${{ env.BUILDOUTPUTPATH }}

      - name: Upload TestResults build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults

      - name: ZIP release artifact
        run: zip -r ${{ env.APP }}-${{ env.VERSION }}.zip ${{ env.BUILDOUTPUTPATH }}

      - name: GitHub release
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ env.APP }}-${{ env.VERSION }}.zip" \
            --title "${{ env.VERSION }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    needs: release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - docker-file: "./src/Dockerfile"
            docker-tag: "amd64"
            platform: "linux/amd64"
          - docker-file: "./src/Dockerfile.arm64"
            docker-tag: "arm64"
            platform: "linux/arm64"
          - docker-file: "./src/Dockerfile.arm32"
            docker-tag: "arm32"
            platform: "linux/arm/v7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}-${{ matrix.docker-tag }}
            type=raw,value=latest-${{ matrix.docker-tag }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ${{ matrix.docker-file }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-publish:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-amd64
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-arm32
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-arm64
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-amd64
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-arm32
          docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-arm64

      - name: Build Docker version image manifest
        run: |
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }} \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-arm32 \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}-arm64

      - name: Push Docker version image manifest
        run: docker manifest push --purge ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:${{ env.VERSION }}

      - name: Build Docker latest image manifest
        run: |
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-arm32 \
            --amend ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest-arm64

      - name: Push Docker latest image manifest
        run: docker manifest push --purge ${{ env.REGISTRY }}/${{ env.DOCKER_NAME }}:latest